<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Job Agent{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'web/css/main.css' %}">
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="brand">🤖 AI Job Agent</a>
      <div class="nav-links">
        <a href="{% url 'job_search' %}"       class="nav-link {% block nav_search %}{% endblock %}">🔍 Job Search</a>
        <a href="{% url 'resume_optimizer' %}" class="nav-link {% block nav_optimizer %}{% endblock %}">📄 Resume Optimizer</a>
      </div>
    </div>
  </nav>

  <!-- ── Main content ───────────────────────────────────────────────── -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'web/js/main.js' %}"></script>
</body>
</html>
